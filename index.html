<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#ffffff" />
<title>Vigilante de Juntas</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet-measure@3.1.0/dist/leaflet-measure.css" />
<script src="https://cdn.jsdelivr.net/npm/proj4@2.11.0/dist/proj4.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  :root{
    --bg:#ffffff; --surface:#f7f7f8; --surface-2:#efeff1;
    --border:#e2e2e5; --border-2:#cfcfd4;
    --text:#1a1a1d; --muted:#6b6b73; --muted-2:#9a9aa2;
    --accent:#2563eb; --success:#15803d; --warn:#b45309; --danger:#b91c1c;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
    font-size:14px;overflow:hidden;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;}
  #app{display:flex;height:100vh;height:100dvh;}

  #map{flex:1;position:relative;z-index:1;background:#f0f0f2;}
  .leaflet-container{background:#f0f0f2 !important;font-family:inherit !important;}

  #panel{width:400px;background:var(--bg);border-left:1px solid var(--border);
    display:flex;flex-direction:column;overflow:hidden;z-index:2;}
  #panel header{padding:16px 20px;border-bottom:1px solid var(--border);
    flex-shrink:0;display:flex;align-items:center;justify-content:space-between;gap:12px;}
  #panel header h1{font-size:14px;font-weight:600;color:var(--text);letter-spacing:-0.01em;}
  #panel header .version{font-size:11px;color:var(--muted-2);font-weight:500;}

  #tabs{display:flex;background:var(--bg);border-bottom:1px solid var(--border);flex-shrink:0;padding:0 12px;}
  #tabs button{flex:1;padding:12px 6px;border:none;background:transparent;color:var(--muted);
    font-size:12px;font-weight:500;cursor:pointer;border-bottom:2px solid transparent;
    transition:color .15s,border-color .15s;font-family:inherit;}
  #tabs button:hover{color:var(--text);}
  #tabs button.active{color:var(--text);border-bottom-color:var(--accent);font-weight:600;}

  .tab-content{display:none;flex:1;overflow-y:auto;padding:20px;-webkit-overflow-scrolling:touch;}
  .tab-content.active{display:block;}
  .tab-content::-webkit-scrollbar{width:6px;}
  .tab-content::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:3px;}

  label{display:block;font-size:12px;font-weight:500;color:var(--muted);margin-bottom:6px;margin-top:16px;}
  label:first-child{margin-top:0;}
  input[type="text"],input[type="date"],input[type="number"],select,textarea{
    width:100%;padding:9px 11px;border:1px solid var(--border-2);border-radius:4px;
    font-size:13px;font-family:inherit;background:var(--bg);color:var(--text);
    transition:border-color .15s;outline:none;}
  input:focus,select:focus,textarea:focus{border-color:var(--accent);}
  textarea{resize:vertical;min-height:64px;line-height:1.4;}
  select{appearance:none;background-image:url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 24 24' fill='none' stroke='%236b6b73' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
    background-repeat:no-repeat;background-position:right 11px center;padding-right:30px;}

  .btn{width:100%;padding:10px 14px;border:1px solid var(--border-2);border-radius:4px;
    font-size:13px;font-weight:500;cursor:pointer;margin-top:8px;font-family:inherit;
    display:flex;align-items:center;justify-content:center;
    transition:background .15s,border-color .15s,opacity .15s;background:var(--bg);color:var(--text);}
  .btn:active{transform:translateY(1px);}
  .btn:disabled{opacity:.4;cursor:not-allowed;}
  .btn:hover:not(:disabled){background:var(--surface);}
  .btn-primary{background:var(--accent);color:#fff;border-color:var(--accent);}
  .btn-primary:hover:not(:disabled){background:#1d4ed8;border-color:#1d4ed8;}
  .btn-danger{background:var(--bg);color:var(--danger);border-color:var(--danger);}
  .btn-danger:hover:not(:disabled){background:#fef2f2;}
  .btn-go{background:var(--success);color:#fff;border-color:var(--success);}
  .btn-go:hover:not(:disabled){background:#166534;}
  .btn-stop{background:var(--danger);color:#fff;border-color:var(--danger);}
  .btn-stop:hover:not(:disabled){background:#991b1b;}

  .section{padding:14px;border:1px solid var(--border);border-radius:6px;margin-bottom:4px;background:var(--surface);}
  .section-title{font-size:12px;font-weight:600;color:var(--text);margin-bottom:10px;}
  .row-2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

  .coord-box{font-size:12px;font-family:'SF Mono',Monaco,Consolas,monospace;color:var(--text);
    margin-bottom:10px;padding:8px 11px;background:var(--bg);border-radius:4px;border:1px solid var(--border);word-break:break-all;}
  .coord-box.empty{color:var(--muted-2);font-style:italic;font-family:inherit;}

  .level-bar{height:20px;background:var(--surface-2);border-radius:4px;overflow:hidden;
    margin-bottom:8px;position:relative;border:1px solid var(--border);}
  .level-fill{height:100%;width:0%;background:var(--accent);transition:width .1s;}
  .level-text{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:600;color:var(--text);}

  #alertBox{display:none;background:#fef2f2;color:var(--danger);
    padding:10px;border-radius:4px;margin-bottom:12px;font-size:13px;
    text-align:center;font-weight:500;border:1px solid var(--danger);}
  #alertBox.show{display:block;}

  table{width:100%;border-collapse:collapse;font-size:12px;}
  th,td{padding:6px 5px;border-bottom:1px solid var(--border);text-align:left;}
  th{color:var(--muted);font-weight:500;}
  tr.alert td{color:var(--danger);font-weight:600;}

  .item{padding:12px 14px;background:var(--bg);border:1px solid var(--border);
    border-radius:6px;margin-bottom:8px;transition:border-color .15s,background .15s;}
  .item:hover{border-color:var(--border-2);background:var(--surface);}
  .item .title{font-weight:600;font-size:13px;display:flex;justify-content:space-between;
    align-items:center;gap:8px;color:var(--text);}
  .item .desc{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.4;}
  .item input,.item select{padding:5px 8px;font-size:12px;}

  .badge{display:inline-block;padding:2px 7px;border-radius:3px;font-size:10px;
    font-weight:500;white-space:nowrap;border:1px solid var(--border-2);color:var(--muted);background:var(--bg);}
  .badge.alto{color:var(--danger);border-color:var(--danger);}
  .badge.ok{color:var(--success);border-color:var(--success);}
  .badge.nueva{color:var(--muted);border-color:var(--border-2);}
  .badge.asc{color:var(--accent);border-color:var(--accent);}
  .badge.desc{color:var(--warn);border-color:var(--warn);}

  .empty-state{text-align:center;padding:32px 16px;color:var(--muted-2);font-size:13px;}
  .list-header{display:flex;align-items:center;justify-content:space-between;
    font-size:12px;color:var(--muted);font-weight:500;margin-bottom:10px;}

  @media (max-width:900px){
    #app{flex-direction:column;}
    #map{display:none;}
    #panel{width:100%;flex:1;border-left:none;}
    #panel header{padding:14px 16px;}
    #tabs button{padding:12px 4px;font-size:11px;}
    .tab-content{padding:16px;padding-bottom:24px;}
  }
</style>
</head>
<body>

<div id="app">
  <div id="map"></div>

  <aside id="panel">
    <header>
      <h1>Vigilante de juntas</h1>
      <span class="version">v1.1</span>
    </header>

    <div id="tabs">
      <button data-tab="ruta" class="active">Ruta</button>
      <button data-tab="juntas">Juntas</button>
      <button data-tab="analisis">Análisis</button>
    </div>

    <!-- ══════ RUTA ══════ -->
    <div class="tab-content active" id="tab-ruta">
      <div class="section">
        <div class="section-title">Parámetros</div>
        <div class="row-2">
          <div><label for="nivelGolpe">Nivel golpe audio</label>
            <input type="number" id="nivelGolpe" value="45" min="10" max="100"></div>
          <div><label for="umbralAcel">Aceleración (m/s²)</label>
            <input type="number" id="umbralAcel" value="15" min="5" max="50"></div>
        </div>
        <div class="row-2">
          <div><label for="radio">Radio junta (m)</label>
            <input type="number" id="radio" value="20" min="5" max="100"></div>
          <div><label for="umbral">Umbral alerta (%)</label>
            <input type="number" id="umbral" value="25" min="5" max="200"></div>
        </div>
        <label for="diasMedia">Días para la media</label>
        <input type="number" id="diasMedia" value="5" min="2" max="30">
      </div>

      <div class="section">
        <div class="section-title">Disparo de foto</div>
        <label style="display:flex;align-items:center;gap:8px;margin:0 0 8px;font-weight:400;">
          <input type="checkbox" id="chkDobleTap" checked> Doble toque en pantalla
        </label>
        <label style="display:flex;align-items:center;gap:8px;margin:0 0 8px;font-weight:400;">
          <input type="checkbox" id="chkGolpeSeco" checked> Golpe seco en el móvil
        </label>
        <div class="row-2">
          <div><label for="umbralGolpeFoto">Umbral golpe foto (m/s²)</label>
            <input type="number" id="umbralGolpeFoto" value="25" min="10" max="80"></div>
          <div><label for="cooldownFoto">Espera entre fotos (s)</label>
            <input type="number" id="cooldownFoto" value="3" min="1" max="30"></div>
        </div>
        <div class="coord-box" id="fotoStatus">Sin foto capturada</div>
        <button class="btn" id="btnFotoManual">Hacer foto ahora</button>
      </div>

      <div class="section">
        <div class="section-title">Estado</div>
        <div class="level-bar"><div class="level-fill" id="levelFill"></div><div class="level-text" id="levelText">—</div></div>
        <div class="coord-box" id="status">Inicializando...</div>
        <div class="coord-box" id="gpsInfo">GPS: —</div>
      </div>

      <button id="startBtn" class="btn btn-go" disabled>Iniciar ruta</button>
      <button id="stopBtn" class="btn btn-stop" style="display:none;">Detener ruta</button>
    </div>

    <!-- ══════ JUNTAS ══════ -->
    <div class="tab-content" id="tab-juntas">
      <div class="coord-box" id="estadoCSV">Cargando CSV de PKs...</div>
      <div class="list-header">
        <span>Juntas detectadas</span>
        <span id="contadorJuntas">0</span>
      </div>
      <div id="listaJuntas">
        <div class="empty-state">Aún no hay juntas detectadas</div>
      </div>
    </div>

    <!-- ══════ ANÁLISIS ══════ -->
    <div class="tab-content" id="tab-analisis">
      <div id="alertBox"></div>
      <div class="list-header">
        <span>Comparación por junta</span>
        <span id="contadorEventos">0</span>
      </div>
      <div id="tablaAnalisis"><div class="empty-state">Sin datos</div></div>

      <label style="margin-top:20px;">Exportar</label>
      <button class="btn btn-primary" id="downloadBtn" disabled>Descargar CSV de eventos</button>
      <button class="btn" id="downloadJuntasBtn" disabled>Descargar CSV de juntas</button>
      <button class="btn btn-danger" id="clearBtn">Borrar todos los datos</button>
    </div>
  </aside>
</div>

<input type="file" id="inputCamara" accept="image/*" capture="environment" style="display:none">

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/leaflet-measure@3.1.0/dist/leaflet-measure.min.js"></script>
<script>
(() => {
  // ══════ SUPABASE ══════
  const SUPABASE_URL = 'https://yacyxoxkggavyeyglzzh.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_rfoOb8wFQP6WwUSoaGF_WA_eA_PfF5O';
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  // ══════ UTM 30N ══════
  proj4.defs('EPSG:25830','+proj=utm +zone=30 +ellps=GRS80 +towgs84=0,0,0,0,0,0,0 +units=m +no_defs');
  function utm30aLatLng(x,y){const [lng,lat]=proj4('EPSG:25830','EPSG:4326',[x,y]);return{lat,lng};}
  function distanciaMetros(la1,lo1,la2,lo2){const R=6371000,rad=Math.PI/180;const dLa=(la2-la1)*rad,dLo=(lo2-lo1)*rad;
    const a=Math.sin(dLa/2)**2+Math.cos(la1*rad)*Math.cos(la2*rad)*Math.sin(dLo/2)**2;
    return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));}

  const $ = id => document.getElementById(id);
  const isMobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);
  const hoy = () => new Date().toISOString().slice(0,10);
  const setStatus = m => $('status').textContent = m;

  // ══════ CSV DE PKs ══════
  let pksCargados = [];
  async function cargarCSV() {
    const el = $('estadoCSV');
    try {
      const r = await fetch('pks.csv');
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const texto = await r.text();
      const parsed = Papa.parse(texto,{header:true,skipEmptyLines:true,transformHeader:h=>h.trim().toLowerCase()});
      pksCargados = parsed.data.map(f=>{
        const carretera=(f.codigoc||f.carretera||'').toString().trim();
        const pk=parseFloat((f.pk_hect||f.pk||'').toString().replace(',','.'));
        const x=parseFloat((f.x||f.utm_x||'').toString().replace(',','.'));
        const y=parseFloat((f.y||f.utm_y||'').toString().replace(',','.'));
        if(!carretera||isNaN(pk)||isNaN(x)||isNaN(y))return null;
        const {lat,lng}=utm30aLatLng(x,y);
        return {carretera,pk,lat,lng};
      }).filter(Boolean);
      if(!pksCargados.length) throw new Error('sin filas válidas');
      el.className='coord-box'; el.style.color='var(--success)';
      el.textContent=`${pksCargados.length} PKs cargados`;
    } catch(err) {
      el.className='coord-box'; el.style.color='var(--warn)';
      el.textContent=`No se pudo cargar pks.csv (${err.message})`;
    }
  }
  function buscarPKCercano(lat,lng,maxMetros=500){
    if(!pksCargados.length) return null;
    let mejor=null,mejorDist=Infinity;
    for(const p of pksCargados){const d=distanciaMetros(lat,lng,p.lat,p.lng);if(d<mejorDist){mejorDist=d;mejor=p;}}
    return mejor && mejorDist<=maxMetros ? {...mejor,distancia:mejorDist} : null;
  }

  // ══════ MAPA ══════
  const CENTRO_LA_RIOJA = [42.4627, -2.4449];
  const pnoa = L.tileLayer.wms('https://www.ign.es/wms-inspire/pnoa-ma',{
    layers:'OI.OrthoimageCoverage',format:'image/jpeg',transparent:false,
    attribution:'PNOA © IGN España',maxZoom:20});
  const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
    attribution:'© OpenStreetMap',maxZoom:19});
  const map = L.map('map',{center:CENTRO_LA_RIOJA,zoom:10,layers:[pnoa],tap:true,touchZoom:true});
  L.control.layers({"Ortofoto PNOA":pnoa,"Mapa de calles":osm}).addTo(map);

  // Regla de medida
  L.control.measure({
    position:'topleft',
    primaryLengthUnit:'meters',
    secondaryLengthUnit:'kilometers',
    primaryAreaUnit:'sqmeters',
    activeColor:'#2563eb',
    completedColor:'#15803d'
  }).addTo(map);

  let pathPolyline = L.polyline([],{color:'#2563eb',weight:3,opacity:.5}).addTo(map);
  let juntaLayer = L.layerGroup().addTo(map);

  // ══════ ESTADO ══════
  let eventos = [];
  let juntas = {};
  let audioContext, analyser, micStream;
  let watchId = null, running = false, ultimaPos = null, ultimoGolpeTs = 0, sampleTimer = null;

  // Foto
  let fotoPendiente = null;
  let ultimaFotoTs = 0;
  let ultimoToqueTs = 0;
  let golpeFotoArmed = false;

  // Sentido por PK
  let historialPK = [];  // [{ ts, pk, carretera }]

  // ══════ SUPABASE ══════
  async function cargarTodo() {
    setStatus('Cargando datos...');
    const [evRes, juRes] = await Promise.all([
      supabaseClient.from('eventos').select('*').order('ts',{ascending:false}),
      supabaseClient.from('juntas').select('*')
    ]);
    if (evRes.error) { setStatus('Error eventos: ' + evRes.error.message); return; }
    if (juRes.error) { setStatus('Error juntas: ' + juRes.error.message); return; }
    eventos = evRes.data || [];
    juntas = {};
    (juRes.data || []).forEach(j => { juntas[j.junta_id] = j; });
    renderTodo();
    setStatus(`✅ ${eventos.length} eventos · ${Object.keys(juntas).length} juntas`);
    $('downloadBtn').disabled = eventos.length === 0;
    $('downloadJuntasBtn').disabled = Object.keys(juntas).length === 0;
  }

  async function guardarEvento(ev) {
    const { error } = await supabaseClient.from('eventos').insert([ev]);
    if (error) { console.error(error); setStatus('Error guardando: ' + error.message); return false; }
    return true;
  }

  async function guardarJunta(j) {
    const { error } = await supabaseClient.from('juntas').upsert([{
      junta_id: j.junta_id,
      carretera: j.carretera || null,
      pk: j.pk || null,
      sentido: j.sentido || 'IND',
      lat: j.lat, lng: j.lng,
      nombre_personalizado: j.nombre_personalizado || null
    }], { onConflict: 'junta_id' });
    if (error) { console.error(error); setStatus('Error junta: ' + error.message); return false; }
    return true;
  }

  async function borrarTodo() {
    if (!confirm('¿Borrar TODOS los eventos y juntas de la nube?')) return;
    await supabaseClient.from('eventos').delete().neq('id', 0);
    await supabaseClient.from('juntas').delete().neq('junta_id', '');
    eventos = []; juntas = {};
    renderTodo();
    $('downloadBtn').disabled = true;
    $('downloadJuntasBtn').disabled = true;
    setStatus('✅ Nube vaciada');
  }

  // ══════ SENSORES ══════
  async function initSensors() {
    if (!isMobile) { setStatus('Modo PC · solo visualización'); return; }
    try {
      setStatus('Solicitando micrófono...');
      micStream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
      audioContext = new (window.AudioContext || window.webkitAudioContext)();
      const src = audioContext.createMediaStreamSource(micStream);
      analyser = audioContext.createAnalyser(); analyser.fftSize=1024; src.connect(analyser);
      setStatus('Comprobando GPS...');
      navigator.geolocation.getCurrentPosition(
        ()=>{$('gpsInfo').textContent='GPS: OK';$('startBtn').disabled=false;setStatus('Listo ✅ Inicia la ruta');},
        (err)=>{$('gpsInfo').textContent='GPS: ✗ '+err.message;setStatus('❌ GPS: '+err.message);},
        {enableHighAccuracy:true,timeout:10000}
      );
    } catch(err) { setStatus('❌ '+err.message); }
  }

  function nivelAudio() {
    const buf = new Uint8Array(analyser.fftSize);
    analyser.getByteTimeDomainData(buf);
    let sum=0;
    for(let i=0;i<buf.length;i++){const v=(buf[i]-128)/128;sum+=v*v;}
    return Math.min(100,Math.max(1,Math.round(Math.sqrt(sum/buf.length)*200)));
  }

  async function iniciarAcelerometro() {
    if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
      try { const p = await DeviceMotionEvent.requestPermission(); if (p !== 'granted') { setStatus('Permiso acelerómetro denegado'); return; } }
      catch { setStatus('Error permiso acelerómetro'); return; }
    }
    window.addEventListener('devicemotion', (event) => {
      if (!running) return;
      const acc = event.accelerationIncludingGravity;
      if (!acc || acc.x === null) return;
      const mag = Math.sqrt(acc.x**2 + acc.y**2 + acc.z**2);

      // Registrar evento por golpe
      const umbralAcel = parseFloat($('umbralAcel').value) || 15;
      if (mag > umbralAcel && Date.now() - ultimoGolpeTs > 1500 && ultimaPos) {
        ultimoGolpeTs = Date.now();
        registrarEvento(new Date().toISOString(), Math.min(100, Math.round(mag*3)), ultimaPos, 'acelerometro');
      }

      // Disparar foto por golpe seco
      if ($('chkGolpeSeco').checked) {
        const umbralFoto = parseFloat($('umbralGolpeFoto').value) || 25;
        const cooldown = (parseFloat($('cooldownFoto').value) || 3) * 1000;
        if (mag > umbralFoto && !golpeFotoArmed && Date.now() - ultimaFotoTs > cooldown) {
          golpeFotoArmed = true;
          dispararFoto('golpe');
        }
        if (golpeFotoArmed && mag < umbralFoto * 0.6) golpeFotoArmed = false;
      }
    });
  }

  function loop() {
    if (!running) return;
    const nivel = nivelAudio();
    $('levelFill').style.width = nivel + '%';
    $('levelText').textContent = `Audio: ${nivel}`;
    const umbralGolpe = parseInt($('nivelGolpe').value) || 45;
    if (nivel >= umbralGolpe && Date.now() - ultimoGolpeTs > 1500 && ultimaPos) {
      ultimoGolpeTs = Date.now();
      registrarEvento(new Date().toISOString(), nivel, ultimaPos, 'audio');
    }
    sampleTimer = setTimeout(loop, 1000);
  }

  // ══════ DETECCIÓN DE SENTIDO ══════
  function detectarSentido(pkActual, carreteraActual) {
    if (pkActual == null) return 'IND';
    const ahora = Date.now();
    const recientes = historialPK.filter(h =>
      h.carretera === carreteraActual &&
      (ahora - h.ts) < 30000 &&
      h.pk !== pkActual
    );
    if (!recientes.length) return 'IND';
    const referencia = recientes[0];
    const delta = pkActual - referencia.pk;
    if (Math.abs(delta) < 0.005) return 'IND';
    return delta > 0 ? 'ASC' : 'DESC';
  }
  function registrarPKHistorial(pk, carretera) {
    if (pk == null) return;
    historialPK.push({ ts: Date.now(), pk, carretera });
    const corte = Date.now() - 60000;
    historialPK = historialPK.filter(h => h.ts > corte);
  }

  // ══════ FOTO ══════
  function dispararFoto(origen) {
    if (!running) return;
    const cooldown = (parseFloat($('cooldownFoto').value) || 3) * 1000;
    if (Date.now() - ultimaFotoTs < cooldown) return;
    ultimaFotoTs = Date.now();
    $('fotoStatus').textContent = `Capturando (${origen})...`;
    $('inputCamara').click();
  }

  document.addEventListener('touchend', (e) => {
    if (!running || !$('chkDobleTap').checked) return;
    if (e.target.closest('button, input, select, textarea, a')) return;
    const ahora = Date.now();
    if (ahora - ultimoToqueTs < 400) {
      dispararFoto('doble tap');
      ultimoToqueTs = 0;
    } else {
      ultimoToqueTs = ahora;
    }
  }, { passive: true });

  $('inputCamara').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    try {
      const base64 = await leerComoBase64(file);
      const comprimido = await comprimirImagen(base64, 800);
      fotoPendiente = comprimido;
      $('fotoStatus').textContent = '✅ Foto lista (se adjuntará al próximo evento)';
      if (ultimaPos) {
        registrarEvento(new Date().toISOString(), 1, ultimaPos, 'foto');
      }
    } catch (err) {
      $('fotoStatus').textContent = '❌ Error al procesar foto';
    }
    e.target.value = '';
  });

  function leerComoBase64(file) {
    return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file);});
  }
  function comprimirImagen(base64, maxW) {
    return new Promise((res)=>{const img=new Image();img.onload=()=>{
      const scale=Math.min(1,maxW/img.width);
      const c=document.createElement('canvas');c.width=img.width*scale;c.height=img.height*scale;
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      res(c.toDataURL('image/jpeg',0.7));
    };img.src=base64;});
  }

  $('btnFotoManual').onclick = () => { ultimaFotoTs = 0; dispararFoto('manual'); };

  // ══════ JUNTAS ══════
  function buscarJuntaCercana(lat, lng, radio, sentido, pk, carretera) {
    // 1) Clave lógica exacta
    if (pk != null && carretera) {
      const pkRed = pk.toFixed(3);
      for (const id in juntas) {
        const j = juntas[id];
        if (j.carretera === carretera && j.pk === pkRed && (j.sentido || 'IND') === sentido) {
          return j;
        }
      }
    }
    // 2) Fallback por radio respetando sentido
    for (const id in juntas) {
      const j = juntas[id];
      if (distanciaMetros(lat, lng, j.lat, j.lng) <= radio) {
        const sJ = j.sentido || 'IND';
        if (sJ === sentido || sJ === 'IND' || sentido === 'IND') return j;
      }
    }
    return null;
  }

  async function registrarEvento(ts, nivel, pos, tipo) {
    const radio = parseInt($('radio').value) || 20;

    const pkCercano = buscarPKCercano(pos.lat, pos.lng);
    const pkNum = pkCercano ? pkCercano.pk : null;
    const carretera = pkCercano ? pkCercano.carretera : null;
    const sentido = detectarSentido(pkNum, carretera);

    let junta = buscarJuntaCercana(pos.lat, pos.lng, radio, sentido, pkNum, carretera);

    if (!junta) {
      const juntaId = 'J-' + Date.now().toString(36).slice(-6);
      junta = {
        junta_id: juntaId,
        carretera: carretera,
        pk: pkNum != null ? pkNum.toFixed(3) : null,
        sentido: sentido,
        lat: pos.lat, lng: pos.lng,
        nombre_personalizado: null
      };
      juntas[juntaId] = junta;
      await guardarJunta(junta);
    }

    registrarPKHistorial(pkNum, carretera);

    const foto = fotoPendiente;
    const ev = {
      ts, junta_id: junta.junta_id, nivel,
      lat: pos.lat, lon: pos.lng, acc: pos.acc,
      alerta: false, tipo, sentido,
      foto: foto || null
    };
    const ok = await guardarEvento(ev);
    if (ok) {
      eventos.unshift({ ...ev, id: Date.now() });
      if (foto) { fotoPendiente = null; $('fotoStatus').textContent = 'Foto adjuntada ✅'; }
      renderTodo();
      $('downloadBtn').disabled = false;
      $('downloadJuntasBtn').disabled = false;
    }
  }

  // ══════ INICIAR / PARAR ══════
  async function iniciarRuta() {
    if (running) return;
    running = true;
    $('startBtn').style.display = 'none';
    $('stopBtn').style.display = 'flex';
    setStatus('🟢 Ruta en curso...');
    await iniciarAcelerometro();
    watchId = navigator.geolocation.watchPosition(
      (p)=>{
        ultimaPos={lat:p.coords.latitude,lon:p.coords.longitude,lng:p.coords.longitude,acc:p.coords.accuracy};
        $('gpsInfo').textContent=`GPS: ±${Math.round(p.coords.accuracy)}m`;
        pathPolyline.addLatLng([ultimaPos.lat, ultimaPos.lng]);
      },
      ()=>{ $('gpsInfo').textContent='GPS: ✗'; },
      {enableHighAccuracy:true,maximumAge:0,timeout:15000}
    );
    loop();
  }

  function pararRuta() {
    running = false;
    if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
    if (sampleTimer) { clearTimeout(sampleTimer); sampleTimer = null; }
    $('startBtn').style.display = 'flex';
    $('stopBtn').style.display = 'none';
    setStatus('⏹ Ruta detenida');
    cargarTodo();
  }

  // ══════ RENDER ══════
  function renderTodo() {
    renderMapa(); renderListaJuntas(); renderAnalisis();
    $('contadorEventos').textContent = eventos.length;
    $('contadorJuntas').textContent = Object.keys(juntas).length;
  }

  function sentidoBadge(s) {
    if (s === 'ASC') return '<span class="badge asc">↑ ASC</span>';
    if (s === 'DESC') return '<span class="badge desc">↓ DESC</span>';
    return '<span class="badge">· IND</span>';
  }

  function renderMapa() {
    juntaLayer.clearLayers();
    for (const id in juntas) {
      const j = juntas[id];
      const nombre = j.nombre_personalizado || j.junta_id;
      const sent = j.sentido || 'IND';
      const color = sent === 'DESC' ? '#b45309' : sent === 'ASC' ? '#2563eb' : '#6b6b73';
      const subtitulo = (j.carretera||'') + (j.pk?' · PK '+j.pk:'') + ' · ' + sent;
      L.circleMarker([j.lat,j.lng],{radius:8,color,fillColor:color,fillOpacity:.7,weight:2})
        .bindPopup(`<b>${nombre}</b><br>${subtitulo}`).addTo(juntaLayer);
    }
    eventos.forEach(e => {
      if (e.foto && e.lat && e.lon) {
        L.circleMarker([e.lat,e.lon],{radius:5,color:'#b45309',fillColor:'#b45309',fillOpacity:.9,weight:1})
          .bindPopup(`<b>Foto</b><br>${new Date(e.ts).toLocaleString()}<br><img src="${e.foto}" style="width:140px;border-radius:4px;margin-top:6px;">`)
          .addTo(juntaLayer);
      }
    });
  }

  function renderListaJuntas() {
    const cont = $('listaJuntas');
    const ids = Object.keys(juntas);
    if (!ids.length) { cont.innerHTML = '<div class="empty-state">Aún no hay juntas detectadas</div>'; return; }
    cont.innerHTML = '';
    ids.forEach(id => {
      const j = juntas[id];
      const div = document.createElement('div');
      div.className = 'item';
      div.innerHTML = `
        <div class="title">
          <span>${j.nombre_personalizado || j.junta_id}</span>
          <span>${sentidoBadge(j.sentido)}</span>
        </div>
        <div class="desc">${j.lat.toFixed(5)}, ${j.lng.toFixed(5)}</div>
        <div class="row-2" style="margin-top:8px;">
          <div>
            <label style="margin-top:0;">Carretera</label>
            <input type="text" data-id="${id}" data-field="carretera" value="${j.carretera||''}" placeholder="LR-111">
          </div>
          <div>
            <label style="margin-top:0;">PK</label>
            <input type="text" data-id="${id}" data-field="pk" value="${j.pk||''}" placeholder="12.400">
          </div>
        </div>
        <div class="row-2" style="margin-top:8px;">
          <div>
            <label style="margin-top:0;">Sentido</label>
            <select data-id="${id}" data-field="sentido">
              <option value="ASC"  ${j.sentido==='ASC'?'selected':''}>Ascendente</option>
              <option value="DESC" ${j.sentido==='DESC'?'selected':''}>Descendente</option>
              <option value="IND"  ${(!j.sentido||j.sentido==='IND')?'selected':''}>Indeterminado</option>
            </select>
          </div>
          <div></div>
        </div>
        <label style="margin-top:8px;">Nombre personalizado</label>
        <input type="text" data-id="${id}" data-field="nombre_personalizado" value="${j.nombre_personalizado||''}" placeholder="Ej. Junta puente Ebro">
        <div style="display:flex;gap:6px;margin-top:8px;">
          <button class="btn" style="margin-top:0;flex:1;" data-action="buscar-pk" data-id="${id}">Buscar PK</button>
          <button class="btn btn-primary" style="margin-top:0;flex:1;" data-action="guardar" data-id="${id}">Guardar</button>
        </div>
      `;
      cont.appendChild(div);
    });
    cont.querySelectorAll('button[data-action]').forEach(btn => {
      btn.onclick = async () => {
        const id = btn.dataset.id;
        const j = juntas[id];
        if (btn.dataset.action === 'guardar') {
          const inputs = cont.querySelectorAll(`input[data-id="${id}"], select[data-id="${id}"]`);
          inputs.forEach(inp => { j[inp.dataset.field] = inp.value.trim() || null; });
          if (!j.sentido) j.sentido = 'IND';
          const ok = await guardarJunta(j);
          if (ok) { setStatus('✅ Junta guardada'); renderTodo(); }
        } else if (btn.dataset.action === 'buscar-pk') {
          const pk = buscarPKCercano(j.lat, j.lng);
          if (pk) {
            const inputs = cont.querySelectorAll(`input[data-id="${id}"], select[data-id="${id}"]`);
            inputs.forEach(inp => {
              if (inp.dataset.field === 'carretera') inp.value = pk.carretera;
              if (inp.dataset.field === 'pk') inp.value = pk.pk.toFixed(3);
            });
            setStatus(`PK encontrado a ${Math.round(pk.distancia)}m`);
          } else {
            setStatus('Sin PK cercano (>500m)');
          }
        }
      };
    });
  }

  function renderAnalisis() {
    const umbral = parseInt($('umbral').value) || 25;
    const diasN = parseInt($('diasMedia').value) || 5;
    const hoyKey = hoy();
    const porJunta = {};
    eventos.forEach(e => { if (e.junta_id) (porJunta[e.junta_id] ??= []).push(e); });
    const filas = [];
    let algunaAlerta = false;
    $('alertBox').classList.remove('show');
    for (const [juntaId, evs] of Object.entries(porJunta)) {
      const porDia = {};
      evs.forEach(e => { const d = e.ts.slice(0,10); porDia[d] = Math.max(porDia[d] || 0, e.nivel); });
      const hoyMax = porDia[hoyKey];
      if (hoyMax == null) continue;
      const previos = Object.entries(porDia).filter(([d]) => d !== hoyKey)
        .sort((a,b)=>b[0].localeCompare(a[0])).slice(0,diasN);
      const j = juntas[juntaId];
      const sentTxt = j?.sentido === 'ASC' ? ' ↑' : j?.sentido === 'DESC' ? ' ↓' : '';
      const nombre = (j?.nombre_personalizado || juntaId) + sentTxt;
      const ubic = j ? `${j.carretera||'—'} · PK ${j.pk||'—'} · ${j.sentido||'IND'}` : '';
      if (!previos.length) { filas.push({juntaId,nombre,ubic,hoyMax,media:null,estado:'nueva'}); continue; }
      const media = previos.reduce((s,[,v])=>s+v,0)/previos.length;
      const limite = media*(1+umbral/100);
      const alerta = hoyMax > limite;
      if (alerta) algunaAlerta = true;
      filas.push({juntaId,nombre,ubic,hoyMax,media,variacion:((hoyMax/media-1)*100).toFixed(0),estado:alerta?'alto':'ok'});
    }
    const cont = $('tablaAnalisis');
    if (!filas.length) { cont.innerHTML = '<div class="empty-state">Sin juntas visitadas hoy</div>'; return; }
    filas.sort((a,b)=>(b.estado==='alto')-(a.estado==='alto'));
    let html = `<table><thead><tr><th>Junta</th><th>Hoy</th><th>Media</th><th>Δ%</th><th></th></tr></thead><tbody>`;
    filas.forEach(f => {
      html += `<tr class="${f.estado==='alto'?'alert':''}">
        <td><b>${f.nombre}</b><br><span style="font-size:10px;color:var(--muted-2)">${f.ubic}</span></td>
        <td>${f.hoyMax}</td>
        <td>${f.media!=null?f.media.toFixed(0):'—'}</td>
        <td>${f.variacion??'—'}</td>
        <td><span class="badge ${f.estado}">${f.estado==='alto'?'ALTO':f.estado==='ok'?'OK':'nueva'}</span></td>
      </tr>`;
    });
    html += '</tbody></table>';
    cont.innerHTML = html;
    if (algunaAlerta) {
      const juntasAltas = filas.filter(f=>f.estado==='alto').map(f=>f.nombre).join(', ');
      $('alertBox').textContent = `⚠️ Nivel elevado en: ${juntasAltas}`;
      $('alertBox').classList.add('show');
    }
  }

  // ══════ CSV ══════
  function descargarCSV(nombre, header, rows) {
    const csv = [header,...rows].map(row=>row.map(v=>{const s=String(v??'');return /[",\n]/.test(s)?`"${s.replace(/"/g,'""')}"`:s;}).join(',')).join('\n');
    const blob = new Blob(['\uFEFF' + csv], {type:'text/csv;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `${nombre}_${hoy()}.csv`; a.click();
    URL.revokeObjectURL(url);
  }

  $('downloadBtn').onclick = () => {
    const header = ['timestamp','junta_id','carretera','pk','sentido','tipo','nivel','lat','lon','precision','alerta','tiene_foto'];
    const rows = eventos.map(e => {
      const j = juntas[e.junta_id] || {};
      return [e.ts, e.junta_id, j.carretera||'', j.pk||'', e.sentido||j.sentido||'IND',
              e.tipo||'audio', e.nivel, e.lat, e.lon, e.acc, e.alerta?'SI':'', e.foto?'SI':''];
    });
    descargarCSV('eventos', header, rows);
  };

  $('downloadJuntasBtn').onclick = () => {
    const header = ['junta_id','carretera','pk','sentido','lat','lng','nombre_personalizado'];
    const rows = Object.values(juntas).map(j => [
      j.junta_id, j.carretera||'', j.pk||'', j.sentido||'IND', j.lat, j.lng, j.nombre_personalizado||''
    ]);
    descargarCSV('juntas', header, rows);
  };

  $('clearBtn').onclick = borrarTodo;

  // ══════ PESTAÑAS ══════
  document.querySelectorAll('#tabs button').forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll('#tabs button').forEach(b=>b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));
      btn.classList.add('active');
      $('tab-' + btn.dataset.tab).classList.add('active');
      setTimeout(()=>map.invalidateSize(),100);
    };
  });

  $('startBtn').onclick = iniciarRuta;
  $('stopBtn').onclick = pararRuta;
  $('umbral').onchange = renderAnalisis;
  $('diasMedia').onchange = renderAnalisis;

  window.addEventListener('resize',()=>map.invalidateSize());
  window.addEventListener('orientationchange',()=>setTimeout(()=>map.invalidateSize(),300));

  // ══════ INICIO ══════
  initSensors();
  cargarTodo();
  setTimeout(cargarCSV, 500);
})();
</script>
</body>
</html>
